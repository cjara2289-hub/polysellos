# Netlify ya NO sirve este sitio. El oficial es Cloudflare Pages:
# https://polysellos.pages.dev
#
# Este archivo solo queda para que polysellos.netlify.app redirija (301) y no se
# rompa ningun enlace viejo (Linktree, perfil de Google, mensajes ya compartidos).
# Las cabeceras de seguridad y de cache viven ahora en _headers.cloudflare.
#
# 'force = true' hace que la redireccion aplique tambien donde existe un archivo,
# incluida la raiz. Cuando ya nadie use el enlace viejo: borrar este archivo, borrar
# el proyecto en Netlify y renombrar _headers.cloudflare a _headers.

[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "https://polysellos.pages.dev/:splat"
  status = 301
  force = true
